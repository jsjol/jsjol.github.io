name: Update publications

# Two jobs with deliberately different trust levels.
#
# refresh   Updates the citation counts and attaches Scholar ids to entries that
#           lack one. Both are mechanically safe -- the sync script verifies that
#           no field value changes -- so this commits straight to master.
#
# propose   Adds entries for papers that are on the Scholar profile but not in
#           the bibliography. Scholar, Crossref and arXiv metadata all need a
#           human eye, and a new entry wants an `abbr`, a `preview` image and
#           possibly `selected`, so this opens a pull request instead.

on:
  schedule:
    - cron: "0 0 * * 1"
    - cron: "0 0 * * 3"
    - cron: "0 0 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Refresh Google Scholar citation counts
        run: |
          # Scholar serves a CAPTCHA to datacenter addresses, so this often
          # cannot succeed from a GitHub runner. One failure must not fail the
          # workflow, but a run of failures must be visible -- see the staleness
          # check below. Locally the same script finishes in about ten seconds.
          if timeout 300 python bin/update_scholar_citations.py; then
            echo "Citation refresh succeeded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Google Scholar refused the request; keeping the existing counts."
            echo "Citation refresh failed; keeping the existing counts." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Attach Scholar ids to existing entries
        run: python bin/sync_publications.py --annotate | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add _data/citations.yml _bibliography/papers.bib
          git diff --staged --quiet || {
            git commit -m "Update citation counts and Scholar ids"
            git push
          }

      - name: Fail if the citation counts have gone stale
        run: |
          # The previous version of this workflow swallowed the CAPTCHA failure
          # and reported success, so the counts sat seven weeks out of date
          # without anyone noticing. Turn a sustained failure into a red run.
          LAST=$(python -c "import yaml; print(yaml.safe_load(open('_data/citations.yml'))['metadata']['last_updated'])")
          AGE=$(( ( $(date +%s) - $(date -d "$LAST" +%s) ) / 86400 ))
          echo "Citation counts last refreshed $LAST ($AGE days ago)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$AGE" -gt 10 ]; then
            echo "::error::Citation counts are $AGE days old. Google Scholar is refusing CI requests; run 'python bin/update_scholar_citations.py' locally (about ten seconds) and push."
            exit 1
          fi

  propose:
    # Runs even when refresh went red. A stale citation file still lists every
    # paper Scholar knew about at its last successful refresh, and the OpenAlex
    # check does not depend on Scholar at all.
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Look for papers missing from the bibliography
        run: python bin/sync_publications.py --append | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request if anything was added
        uses: peter-evans/create-pull-request@v7
        with:
          branch: publications/new-entries
          add-paths: _bibliography/papers.bib
          commit-message: "Add publications found on Google Scholar"
          title: "New publications found on Google Scholar"
          body: |
            One or more papers on the Google Scholar profile are not in
            `_bibliography/papers.bib`. The entries below were appended, with
            metadata from Crossref where a DOI exists and from arXiv otherwise.

            Each is marked with a `% TODO` comment. Before merging, please:

            - check the venue and author list, which Scholar and Crossref both
              get wrong from time to time;
            - add `abbr` if the venue has a short form;
            - add a `preview` image in `assets/img/publication_preview/` if the
              paper deserves a thumbnail, and remember to keep it under 1400 px;
            - add `selected = {true}` to put it on the front page;
            - delete the `% TODO` comment.

            If a record should never be added — Scholar occasionally attributes
            someone else's paper to the profile — add its title or publication id
            to `_data/scholar_ignore.yml` instead, and close this PR.
          labels: publications
          delete-branch: true
