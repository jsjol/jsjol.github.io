# -----------------------------------------------------------------------------
# Site
# -----------------------------------------------------------------------------

title: # blank uses full name
first_name: Jens
middle_name:
last_name: Sjölund
contact_note:
description: >
  Assistant Professor in Artificial Intelligence at Uppsala University.
  Machine learning and optimization to make computationally hard problems tractable.
footer_text: >
  Built with <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> and the
  <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
keywords: machine learning, optimization, graph neural networks, self-driving labs, diffusion models, Uppsala University
lang: en
icon: ⚛️

url: https://jsjol.github.io
baseurl:

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true
back_to_top: true
last_updated: false
max_width: 930px

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------
# Preview cards for links shared on Bluesky, LinkedIn, Slack and Mastodon.

serve_og_meta: true
serve_schema_org: true
og_image: /assets/img/og-preview.png

# -----------------------------------------------------------------------------
# Optional features
# -----------------------------------------------------------------------------

enable_math: true # MathJax typesetting
enable_darkmode: true # light/dark/system theme switch in the navbar
enable_medium_zoom: true # click to enlarge images
enable_progressbar: true # scroll-position bar under the navbar
enable_publication_thumbnails: true
enable_google_verification: false
google_site_verification:

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
# news items are rendered inline inside the news table on / and /news/, so they
# get no standalone pages: output: false. A news item is a file named
# YYYY-MM-DD-slug.md in _news/ whose only front matter is its date.

collections:
  news:
    output: false
  projects:
    output: true
    permalink: /projects/:name/
  teachings:
    output: true
    permalink: /teachings/:name/

# -----------------------------------------------------------------------------
# Jekyll
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include: ["_pages"]
exclude:
  - AGENTS.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - bin/
  - package.json
  - package-lock.json
  - purgecss.config.js
  - vendor
keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll-3rd-party-libraries
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed

jekyll-minifier:
  compress_javascript: false
  compress_css: false
  compress_json: false
  remove_spaces_inside_tags: false
  remove_multi_spaces: false
  remove_comments: false
  remove_intertag_spaces: false
  remove_quotes: false
  simple_doctype: false
  remove_script_attributes: false
  remove_style_attributes: false
  remove_link_attributes: false
  remove_form_attributes: false
  remove_input_attributes: false
  remove_http_protocol: false
  remove_https_protocol: false
  preserve_line_breaks: true
  simple_boolean_attributes: false
  compress_sass: false
  exclude: ["robots.txt"]

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:
  last_name: [Sjölund]
  first_name: [Jens, J.]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending

bib_search: true

# Citation-count badges shown on each publication.
enable_publication_badges:
  altmetric: true
  dimensions: true
  google_scholar: true

# BibTeX keys used internally by the templates, hidden from the rendered entry.
filtered_bibtex_keywords:
  [
    abbr,
    abstract,
    additional_info,
    altmetric,
    annotation,
    arxiv,
    award,
    award_name,
    bibtex_show,
    code,
    dimensions,
    eprint,
    google_scholar_id,
    hal,
    html,
    pdf,
    pmid,
    poster,
    preview,
    selected,
    slides,
    supp,
    video,
    website,
  ]

# Authors beyond this count are revealed on click.
max_author_limit: 3
more_authors_animation_delay: 10

# -----------------------------------------------------------------------------
# GitHub stat cards on /repositories/
# -----------------------------------------------------------------------------

repo_theme_light: default
repo_theme_dark: dark
external_services:
  github_readme_stats_url: https://github-readme-stats.vercel.app

# -----------------------------------------------------------------------------
# Jekyll Link Attributes
# -----------------------------------------------------------------------------

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# -----------------------------------------------------------------------------
# Responsive WebP images
# -----------------------------------------------------------------------------
# Requires imagemagick on PATH (`magick -version`). The three widths below are
# what `_includes/figure.liquid` puts in the srcset, so no source image needs to
# be wider than 1400px.

imagemagick:
  enabled: true
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
  output_formats:
    webp: "-auto-orient -quality 85"

lazy_loading_images: true

# -----------------------------------------------------------------------------
# Third-party libraries
# -----------------------------------------------------------------------------
# Only the libraries actually loaded by _includes/head.liquid and
# _includes/scripts.liquid. Integrity hashes guard against a tampered CDN.

third_party_libraries:
  download: false
  google_fonts:
    url:
      fonts: "https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons&display=swap"
  jquery:
    integrity:
      js: "sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
    url:
      js: "https://cdn.jsdelivr.net/npm/jquery@{{version}}/dist/jquery.min.js"
    version: "3.6.0"
  mathjax:
    integrity:
      js: "sha256-MASABpB4tYktI2Oitl4t+78w/lyA+D7b/s9GEP0JOGI="
    local:
      fonts: "output/chtml/fonts/woff-v2/"
    url:
      fonts: "https://cdn.jsdelivr.net/npm/mathjax@{{version}}/es5/output/chtml/fonts/woff-v2/"
      js: "https://cdn.jsdelivr.net/npm/mathjax@{{version}}/es5/tex-mml-chtml.js"
    version: "3.2.2"
  mdb:
    integrity:
      css: "sha256-jpjYvU3G3N6nrrBwXJoVEYI/0zw8htfFnhT9ljN3JJw="
      js: "sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA="
    url:
      css: "https://cdn.jsdelivr.net/npm/mdbootstrap@{{version}}/css/mdb.min.css"
      js: "https://cdn.jsdelivr.net/npm/mdbootstrap@{{version}}/js/mdb.min.js"
    version: "4.20.0"
  medium_zoom:
    integrity:
      js: "sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc="
    url:
      js: "https://cdn.jsdelivr.net/npm/medium-zoom@{{version}}/dist/medium-zoom.min.js"
    version: "1.1.0"
